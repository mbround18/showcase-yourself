[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
actix-cors = "0.7.1"
actix-csrf = "0.8.0"
actix-governor = "0.10.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.14.1"
dotenv = "0.15.0"
futures-util = "0.3.34"
mongodb = "3.8.0"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = { version = "0.8", features = ["std_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
url = "2.5.8"
