name: Docker Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "*"
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mbround18/paws/actions/paws-up@main

      - name: Resolve release version
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            version="${{ github.ref_name }}"
          else
            version=$(paws semver --branch main)
          fi
          echo "Resolved version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mbround18/paws/actions/paws-up@main

      - name: paws ci (rust)
        working-directory: backend
        run: paws ci --toolchain rust

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mbround18/paws/actions/paws-up@main

      - name: paws ci (node)
        working-directory: frontend
        run: paws ci --toolchain node

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: |
          cp compose.env.example compose.env
          docker compose up -d --build

      - name: Wait for the ingress to answer
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Stack did not become ready in time" >&2
          docker compose logs
          exit 1

      - name: Run Playwright e2e tests
        working-directory: e2e
        run: npx playwright test

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  docker-release:
    needs: [version, test-backend, test-frontend, e2e]
    name: paws docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: Dockerfile
            context: ./frontend
          - name: backend
            dockerfile: Dockerfile
            context: ./backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mbround18/paws/actions/paws-up@main

      - name: paws docker
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          paws docker \
            --image "mbround18/showcase-yourself-${{ matrix.name }}" \
            --version "${{ needs.version.outputs.version }}" \
            --dockerfile "${{ matrix.dockerfile }}" \
            --context "${{ matrix.context }}" \
            --with-latest \
            --dockerhub-username mbround18

  tagger:
    needs: [version, docker-release]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mbround18/paws/actions/paws-up@main

      - name: Compute and push next tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: paws semver --branch main --push
